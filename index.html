<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7cfd3">
<title>耳つぼケア レシピ帳</title>
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.JPG">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7cfd3;color:#382d2b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:540px;margin:auto;padding:16px}
.card{background:#fffdfd;border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 7px 20px #8b53651a}
.logo{width:92px;height:92px;object-fit:contain;border-radius:50%;display:block;margin:0 auto 8px}
h1{font-size:28px;color:#7e3049;text-align:center;margin:4px 0}
.sub{text-align:center;color:#8b6874;font-size:13px;line-height:1.6}
.search{width:100%;border:2px solid #efd3dc;background:#fff;border-radius:15px;padding:13px;font-size:16px;margin:14px 0 6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
.recipeBtn{border:0;border-radius:16px;padding:13px 8px;background:#fff;border:1.5px solid #edcbd6;color:#653848;font-size:15px;font-weight:800;box-shadow:0 3px 8px #0000000a}
.recipeBtn:active{transform:scale(.98)}
#detail{display:none}
.back{border:0;background:#eee4e7;color:#604b52;border-radius:14px;padding:10px 14px;font-weight:800}
.title{font-size:27px;font-weight:900;color:#7e3049;margin:12px 0 4px;text-align:center}
.ear{position:relative;width:min(88vw,390px);margin:12px auto}
.ear img{display:block;width:100%;border-radius:18px}
.dot{position:absolute;width:25px;height:25px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid white;box-shadow:0 2px 8px #0006}
.dot.front{background:#e55e91}.dot.back{background:#8060ad}.dot.stim{background:#4daaaa}
.legend{text-align:center;font-size:13px;color:#746169;margin:5px 0 14px}
.legend span{display:inline-flex;align-items:center;margin:0 5px}
.ball{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:4px}
.frontB{background:#e55e91}.backB{background:#8060ad}.stimB{background:#4daaaa}
.row{padding:13px 14px;border:1.5px solid #efd7df;border-radius:16px;margin:9px 0;background:#fff}
.row b{font-size:18px;color:#79374d}.effect{margin-top:5px;line-height:1.55;color:#5d5154}
.note{font-size:12px;line-height:1.55;color:#7d6d72;background:#fff6f8;border-radius:13px;padding:11px;margin-top:14px}
.empty{text-align:center;padding:18px;color:#876d76}
</style>
</head>
<body>
<div class="wrap">
<section id="menu" class="card">
<img class="logo" src="mcs_logo.PNG" alt="MCS">
<h1>耳つぼケア レシピ帳</h1>
<div class="sub">気になる項目をポチッ👆<br>耳のどこを使うか、パッと確認できるで</div>
<input id="search" class="search" placeholder="症状を検索　例：鼻炎、PMS、シミ">
<div id="grid" class="grid"></div>
<div class="note">※協会テキストの学習・確認用。耳の形や位置には個人差があります。細かい位置は協会テキストで確認してください。</div>
</section>

<section id="detail" class="card">
<button id="backBtn" class="back">← レシピ一覧</button>
<div id="recipeTitle" class="title"></div>
<div class="ear">
<img id="earImg" src="ear_base.PNG" alt="耳">
<div id="dots"></div>
</div>
<div class="legend"><span><i class="ball frontB"></i>表</span><span><i class="ball backB"></i>裏</span><span><i class="ball stimB"></i>刺激のみ</span></div>
<div id="rows"></div>
<div class="note">※この画面の点は「耳つぼ どこやねん！」の座標を利用した学習用の目安表示です。</div>
</section>
</div>

<script>
const F={"神門":[45.7,27.8],"角窩中":[39.7,26.9],"内生殖器":[33,25.3],"交感":[31.7,30.5],"坐骨神経":[40.2,32.5],"股関節":[73.2,21.5],"膝":[70.6,17.4],"踝":[64.5,13.7],"風渓":[78.5,24.2],"腰仙椎":[78.3,27.6],"胸椎":[82.2,52.7],"頸椎":[73.3,62.8],"腕":[77.8,25],"肘":[83.9,32.9],"肩":[85.1,47.1],"鎖骨":[76,59.5],"後頭":[66.4,64.2],"側頭":[49.9,64.4],"前頭":[37.7,72.3],"大脳皮質下":[48.5,64.6],"顎":[51.8,76.8],"歯":[25.6,79.9],"内耳":[50.7,88.8],"目":[36.6,87.4],"扁桃体":[33.7,94.1],"内分泌":[29,66.6],"三焦":[30.3,64.6],"肺":[44.5,56.6],"心":[39.6,56.6],"気管":[35.9,55.1],"副腎":[27.3,55.7],"飢点":[18.9,55.1],"内鼻":[32.2,53.1],"咽喉":[31.9,46.6],"口":[34.7,49.1],"食道":[40.6,50.4],"噴門":[53,51.9],"胃":[65.8,52.2],"小腸":[50.7,44],"大腸":[36.3,38.6],"腎":[53.2,35.6],"膀胱":[42.1,34.4],"艇角":[31.2,32.9],"肝":[64.4,41.3],"脾":[65.8,56.3],"耳中":[49.7,47.4],"肛門":[39.2,10.3],"耳先":[58.2,5.9],"耳輪":[85.7,23.3]};
const B={"耳迷根":[83.5,45.7]};

// 今回送ってもらったレシピ19〜30
const recipes=[
{n:19,t:"鼻炎",p:[
["神門","ストレス緩和、消炎、自律神経の調整"],
["副腎","副腎皮質ホルモンの調整"],
["内鼻","鼻水、鼻詰まり"],
["肺","水分調整、風邪"],
["大腸","便秘、腸炎、代謝"]]},
{n:20,t:"咳",p:[
["咽喉","喉の痛み"],["肺","水分調整、風邪"],["気管","気管支炎"]]},
{n:21,t:"頻尿",p:[
["腎","腎炎、腎機能障害、膀胱炎"],
["膀胱","膀胱炎、尿もれ、頻尿"],
["大脳皮質下","脳の誤作動"]]},
{n:22,t:"いびき・睡眠時無呼吸症候群",p:[
["咽喉","喉を拡げる"],["気管","気管を拡げる"],["肺","気の巡り、風邪"],["大脳皮質下","精神の高ぶりを抑える"]]},
{n:23,t:"乗り物酔い",p:[
["耳迷根","めまい"],["後頭","後頭部の痛み、乗り物酔い"],["内耳","三半規管の調整"],["胃","胃の不快感"]]},
{n:24,t:"蕁麻疹",p:[
["神門","ストレス緩和、消炎、自律神経の調整"],["副腎","副腎皮質ホルモンの調整"],["肺","水分調整、皮膚炎、気の巡り"]]},
{n:25,t:"口内炎",p:[
["神門","ストレス緩和、消炎、自律神経の調整"],["舌","潰瘍性の口内炎、舌炎"],["口","口内炎"],["胃","慢性胃炎、消化不良"],["脾","口内炎、消化吸収"]]},
{n:26,t:"脱毛症",p:[
["肛門","発毛"],["腎","脱毛症、円形脱毛症"],["大腸","代謝"],["肺","気の巡り"]]},
{n:27,t:"PMS",p:[
["内生殖器","月経不順、生理痛"],["腰仙椎","腰痛"],["腎","月経トラブル"],["肝","血行促進、月経痛、貧血"]]},
{n:28,t:"目の下のクマ",p:[
["肝","血行促進、貧血、不眠"],["目","目の疲れ"],["後頭","後頭部の緊張緩和"]]},
{n:29,t:"ニキビ",p:[
["肺","水分調整、皮膚炎、気の巡り"],["大腸","便秘、腸炎、代謝"],["内分泌","ホルモンの調整","stim"]]},
{n:30,t:"シミ",p:[
["肝","血行促進"],["肺","水分調整、皮膚の潤い、気の巡り"],["内分泌","ホルモンの調整","stim"]]}
];

// テキスト写真に出たが「どこやねん！」50点座標に未登録の点。
// 推測座標は入れず、一覧には表示して耳画像には点を出さない。
const aliases={"肝（右）":"肝","脾（左）":"脾","内分泌（刺激のみ）":"内分泌"};

function renderList(q=""){
 const g=document.getElementById("grid"); g.innerHTML="";
 const a=recipes.filter(r=>(r.n+" "+r.t+" "+r.p.flat().join(" ")).toLowerCase().includes(q.toLowerCase()));
 if(!a.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">見つからへんかった🤣</div>';return}
 a.forEach(r=>{let b=document.createElement("button");b.className="recipeBtn";b.innerHTML=`<small>レシピ${r.n}</small><br>${r.t}`;b.onclick=()=>openRecipe(r);g.appendChild(b)})
}
function pointName(name){return aliases[name]||name}
function openRecipe(r){
 menu.style.display="none"; detail.style.display="block"; recipeTitle.textContent=`レシピ${r.n}：${r.t}`;
 dots.innerHTML=""; rows.innerHTML="";
 let needsBack=r.p.some(x=>pointName(x[0])==="耳迷根");
 earImg.src=needsBack?"ear_back.PNG":"ear_base.PNG";
 r.p.forEach((x,idx)=>{
   let name=x[0], base=pointName(name), mode=x[2]||"front", pos=needsBack?B[base]:F[base];
   // 耳迷根だけ裏画像。その他との混在時は、裏点は画像上に出し、それ以外は一覧で確認。
   if(needsBack && base!=="耳迷根") pos=null;
   if(pos){
     let d=document.createElement("span");d.className="dot "+(mode==="stim"?"stim":needsBack?"back":"front");
     d.style.left=pos[0]+"%";d.style.top=pos[1]+"%";d.title=name;dots.appendChild(d);
   }
   let rr=document.createElement("div");rr.className="row";
   rr.innerHTML=`<b>${idx+1}. ${name}</b><div class="effect">${x[1]}</div>${!pos?'<div style="font-size:12px;color:#a16a7c;margin-top:4px">※この耳画像では位置表示なし</div>':""}`;
   rows.appendChild(rr);
 });
 window.scrollTo({top:0,behavior:"smooth"});
}
search.oninput=e=>renderList(e.target.value);
backBtn.onclick=()=>{detail.style.display="none";menu.style.display="block";window.scrollTo({top:0,behavior:"smooth"})};
renderList();
</script>
</body></html>
